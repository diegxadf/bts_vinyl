# Compila la app de iOS en los Mac de GitHub (no hace falta tener un Mac).
# - Siempre: comprueba que compila (versión para simulador, sin firmar).
# - Si están los "secrets" de App Store Connect: la firma y la sube a TestFlight / App Store Connect.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'css/**', 'js/**', 'vendor/**', 'icons/**', 'ios/**', 'capacitor.config.json', 'package*.json', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar la app web
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Comprobar que compila (simulador)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30

      - name: Firmar y subir a App Store Connect
        if: ${{ env.HAS_ASC == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 -d > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"

          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0.0 $AUTH | tail -n 30

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -n 30
